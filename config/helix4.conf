# Increase Bluetooth transmit power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Use 2M PHY for lower latency (halves per-packet air time)
CONFIG_BT_CTLR_PHY_2M=y

# Request faster BT connection intervals (7.5ms min, 15ms max)
# Preferred values in 1.25ms units: 6 = 7.5ms, 12 = 15ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Reduce key debounce (default 5ms each → 3ms press, 3ms release)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Run display updates on a dedicated thread so they don't block BLE
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Lower display thread priority (higher number = lower priority)
# Default is 5; 10 ensures BLE radio events are never starved by rendering
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Disable heavy nice_oled widgets enabled by default on the central side
# WPM speedometer + Luna animation cause continuous rendering during typing
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
# Modifier indicators re-render on every Ctrl/Shift/Alt/Gui press
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
# HID indicators add an extra HID endpoint + animation overhead
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_ZMK_HID_INDICATORS=n

# Deep Sleep after 15min of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Soft-off feature (also enables PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME automatically)
CONFIG_ZMK_PM_SOFT_OFF=y

# Ensure display blanks on idle (complements soft_off)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Enable nice_oled custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
